name: Qualify flow-registry

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Full commit SHA of the selected flow-registry ref
        type: string
        required: true
      source_controller_sha:
        description: Full commit SHA of source-controller
        type: string
        required: true
      model_registry_sha:
        description: Full commit SHA of model-registry
        type: string
        required: true
      executor_registry_sha:
        description: Full commit SHA of executor-registry
        type: string
        required: true

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      SOURCE_CONTROLLER_SHA: ${{ inputs.source_controller_sha }}
      MODEL_REGISTRY_SHA: ${{ inputs.model_registry_sha }}
      EXECUTOR_REGISTRY_SHA: ${{ inputs.executor_registry_sha }}
      GOTOOLCHAIN: local
      GOWORK: 'off'
    steps:
      - name: Verify dispatch SHAs
        shell: bash
        run: |
          for input in EXPECTED_SOURCE_SHA SOURCE_CONTROLLER_SHA MODEL_REGISTRY_SHA EXECUTOR_REGISTRY_SHA; do
            if [[ ! "${!input}" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "$input must be a 40-digit hexadecimal commit SHA." >&2
              exit 1
            fi
          done
          if [[ "$GITHUB_SHA" != "${EXPECTED_SOURCE_SHA,,}" ]]; then
            echo 'The dispatch ref does not resolve to expected_source_sha.' >&2
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Stage declarations and pinned publisher schemas
        shell: bash
        run: |
          source_sha="${EXPECTED_SOURCE_SHA,,}"
          if [[ "$(git rev-parse HEAD)" != "$source_sha" ]]; then
            echo 'The checkout does not match expected_source_sha.' >&2
            exit 1
          fi
          if [[ ! -f go.mod ]]; then
            echo 'Dispatch on the reviewed standalone candidate branch.' >&2
            exit 1
          fi

          contracts="$RUNNER_TEMP/flow-registry-contracts"
          mkdir "$contracts"
          mkdir -p "$contracts/qa-e2e/scripts"
          git show "$source_sha:qualification/flow-registry-declarations.json" > "$contracts/qa-e2e/scripts/shared-test-inputs.json"

          fetch_schema() {
            local repo="$1" sha="$2" root="$3" file="$4" status
            local url="https://raw.githubusercontent.com/pandops/$repo/${sha,,}/schemas/$file"
            local output="$root/schemas/$file"
            mkdir -p "$contracts/$root/schemas"
            status="$(curl -q --silent --show-error --fail --proto '=https' --max-time 30 \
              --output "$contracts/$output" --write-out '%{http_code}' "$url")"
            if [[ "$status" != 200 ]]; then
              echo "Unexpected HTTP status $status for $url." >&2
              exit 1
            fi
            jq -e 'type == "object"' "$contracts/$output" > /dev/null
            printf '%s ' "$url"
            (cd "$contracts" && sha256sum "$output")
          }

          fetch_schema flowai-source-controller "$SOURCE_CONTROLLER_SHA" svc/source-controller service.binding-guard.reply.schema.json
          fetch_schema flowai-source-controller "$SOURCE_CONTROLLER_SHA" svc/source-controller service.binding-guard.request.schema.json
          fetch_schema flowai-source-controller "$SOURCE_CONTROLLER_SHA" svc/source-controller service.sources-lookup.reply.schema.json
          fetch_schema flowai-source-controller "$SOURCE_CONTROLLER_SHA" svc/source-controller service.sources-lookup.request.schema.json
          fetch_schema flowai-model-registry "$MODEL_REGISTRY_SHA" svc/model-registry defs.schema.json
          fetch_schema flowai-model-registry "$MODEL_REGISTRY_SHA" svc/model-registry service.apply-flow-team.reply.schema.json
          fetch_schema flowai-model-registry "$MODEL_REGISTRY_SHA" svc/model-registry service.apply-flow-team.request.schema.json
          fetch_schema flowai-model-registry "$MODEL_REGISTRY_SHA" svc/model-registry service.flows-status.reply.schema.json
          fetch_schema flowai-model-registry "$MODEL_REGISTRY_SHA" svc/model-registry service.flows-status.request.schema.json
          fetch_schema flowai-model-registry "$MODEL_REGISTRY_SHA" svc/model-registry service.remove-flow-team.reply.schema.json
          fetch_schema flowai-model-registry "$MODEL_REGISTRY_SHA" svc/model-registry service.remove-flow-team.request.schema.json
          fetch_schema flowai-model-registry "$MODEL_REGISTRY_SHA" svc/model-registry service.validate-models.reply.schema.json
          fetch_schema flowai-model-registry "$MODEL_REGISTRY_SHA" svc/model-registry service.validate-models.request.schema.json
          fetch_schema flowai-executor-registry "$EXECUTOR_REGISTRY_SHA" svc/executor-registry service.team-tags.reply.schema.json
          fetch_schema flowai-executor-registry "$EXECUTOR_REGISTRY_SHA" svc/executor-registry service.team-tags.request.schema.json
          printf 'FLOWAI_CONTRACT_FIXTURE_DIR=%s\n' "$contracts" >> "$GITHUB_ENV"

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.2'
          cache: false

      - name: Unit tests
        shell: bash
        run: go test -mod=readonly -count=1 -coverpkg=./... -v ./...

      - name: PostgreSQL integration tests
        shell: bash
        run: |
          postgres='docker.io/library/postgres@sha256:a85daf0dbd5e79586e850e3fe4b21b796799828ad015ce2166aeb98cc24da61c'
          docker pull --platform linux/amd64 "$postgres"
          # The existing test fixture resolves this alias in the runner's Docker store.
          docker tag "$postgres" docker.io/library/postgres:16
          go test -mod=readonly -count=1 -coverpkg=./... -tags=integration -v ./...

      - name: Build local Linux image
        shell: bash
        run: |
          docker build --platform linux/amd64 -f Containerfile --iidfile "$RUNNER_TEMP/flow-registry.iid" .
          cat "$RUNNER_TEMP/flow-registry.iid"
